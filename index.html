<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa do Terreiro</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f2f2f2;
      padding:15px;
    }
    h1{
      text-align:center;
      color:#333;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:10px;
      overflow:hidden;
    }
    th, td{
      border:1px solid #ddd;
      padding:10px;
      text-align:center;
    }
    th{
      background:#222;
      color:white;
    }
    input[type="text"]{
      width:90%;
      padding:6px;
      border:1px solid #ccc;
      border-radius:6px;
    }
    tr.pago{
      background:#9be79b;
    }
  </style>
</head>
<body>

<h1>Rifa do Terreiro</h1>

<table id="rifa">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Comprador</th>
      <th>PIX Pago</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Maria</td>
      <td><input type="text"></td>
      <td><input type="checkbox" onchange="marcarPago(this)"></td>
    </tr>
    <tr>
      <td>João</td>
      <td><input type="text"></td>
      <td><input type="checkbox" onchange="marcarPago(this)"></td>
    </tr>
    <tr>
      <td>José</td>
      <td><input type="text"></td>
      <td><input type="checkbox" onchange="marcarPago(this)"></td>
    </tr>
    <tr>
      <td>Ana</td>
      <td><input type="text"></td>
      <td><input type="checkbox" onchange="marcarPago(this)"></td>
    </tr>
  </tbody>
</table>

<script>
function marcarPago(checkbox){
  const linha = checkbox.parentElement.parentElement;
  if(checkbox.checked){
    linha.classList.add("pago");
  } else {
    linha.classList.remove("pago");
  }
}
</script>

</body>
</html>
