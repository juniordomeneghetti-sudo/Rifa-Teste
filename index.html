<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa do Terreiro</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      text-align:center;
      padding:20px;
    }
    h1{
      color:#333;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
      gap:10px;
      max-width:900px;
      margin:20px auto;
    }
    .nome{
      background:white;
      border:2px solid #ccc;
      border-radius:10px;
      padding:15px;
      cursor:pointer;
      transition:.2s;
      font-weight:bold;
    }
    .nome:hover{
      transform:scale(1.03);
    }
    .marcado{
      background:#4caf50;
      color:white;
      border-color:#2e7d32;
    }
  </style>
</head>
<body>

  <h1>🎉 Rifa do Terreiro 🎉</h1>
  <p>Toque no nome para marcar como vendido</p>

  <div class="grid" id="grid"></div>

  <script>
    const nomes = [
      "Maria","João","Ana","Carlos","Pedro",
      "Paula","José","Marcos","Lucia","Rita",
      "André","Juliana","Ricardo","Patrícia","Fernando",
      "Cláudia","Bruno","Camila","Diego","Aline",
      "Roberto","Vanessa","Leandro","Tatiane","Eduardo"
    ];

    const grid = document.getElementById("grid");

    nomes.forEach(nome => {
      const div = document.createElement("div");
      div.className = "nome";
      div.textContent = nome;

      div.onclick = () => {
        div.classList.toggle("marcado");
      };

      grid.appendChild(div);
    });
  </script>

</body>
</html>
