<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rifa 2.0</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ececec;
padding:15px;
}

h1{
text-align:center;
margin-bottom:5px;
}

.subtitulo{
text-align:center;
font-size:22px;
margin-bottom:20px;
font-weight:bold;
color:#0b7d30;
}

.painel{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;

}

.card{

background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 0 6px rgba(0,0,0,.2);

}

.card h2{

font-size:14px;

}

.card span{

font-size:28px;
font-weight:bold;

}

.botoes{

display:flex;
gap:10px;
justify-content:center;
margin-bottom:15px;
flex-wrap:wrap;

}

button{

padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;

}

.login{

background:#222;
color:white;

}

.logout{

background:#777;
color:white;

}

.reset{

background:#d50000;
color:white;

}

input[type=text]{

width:100%;
padding:8px;
border-radius:6px;
border:1px solid #bbb;

}

#pesquisa{

margin-bottom:15px;

}

table{

width:100%;
border-collapse:collapse;
background:white;

}

th{

background:#202020;
color:white;
padding:10px;

}

td{

padding:8px;
border:1px solid #ddd;
text-align:center;

}

.disponivel{

background:white;

}

.reservado{

background:#fff8d5;

}

.pago{

background:#b9f6ca;

}

.status{

font-weight:bold;

}

.verde{

color:#0c8a33;

}

.amarelo{

color:#b8860b;

}

.azul{

color:#1565c0;

}

.btnReservar{

background:#1565c0;
color:white;

}

.btnPago{

background:#2e7d32;
color:white;

}

.btnLiberar{

background:#d32f2f;
color:white;

}

@media(max-width:700px){

.painel{

grid-template-columns:repeat(2,1fr);

}

table{

font-size:13px;

}

button{

font-size:13px;

}

}

</style>

</head>

<body>

<h1>Rifa Beneficente</h1>

<div class="subtitulo">

Prêmio Surpresa

</div>

<div class="painel">

<div class="card">
<h2>Total</h2>
<span id="totalNomes">0</span>
</div>

<div class="card">
<h2>Disponíveis</h2>
<span id="dispNomes">0</span>
</div>

<div class="card">
<h2>Reservados</h2>
<span id="resNomes">0</span>
</div>

<div class="card">
<h2>Pagos</h2>
<span id="pagNomes">0</span>
</div>

</div>

<input
id="pesquisa"
type="text"
placeholder="Pesquisar nome..."
onkeyup="pesquisar()">

<div class="botoes">

<button
class="login"
onclick="loginAdmin()">

Login Admin

</button>

<button
class="logout"
onclick="logoutAdmin()"
style="display:none"
id="btnLogout">

Sair

</button>

<button
class="reset"
onclick="resetarRifa()"
style="display:none"
id="btnReset">

Reset Geral

</button>

</div>

<table>

<thead>

<tr>

<th>Nome</th>
<th>Comprador</th>
<th>Status</th>
<th>Ação</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

<script>

const senhaAdmin="Axé2026";

let admin=false;

const valorNome=10;

const nomes=[

"Clarice",
"Solange",
"Cecília",
"Raquel",
"Lilian",
"Nailda",
"Lourdes",
"Euvira",
"Suelã",
"Joelma",
"Nazaré",
"Edna",
"Márcia",
"Sueli",
"Sheila",
"Sandra",
"Eliane",
"Ivaneide",
"Carolina",
"Paula",
"Carla",
"Neide",
"Lúcia",
"Rosa",
"Gisele"

];

function carregar(){

const dados=localStorage.getItem("rifa");

if(dados){

return JSON.parse(dados);

}

return nomes.map(nome=>({

nome:nome,

comprador:"",

travado:false,

pago:false

}));

}

let lista=carregar();

function salvar(){

localStorage.setItem("rifa",JSON.stringify(lista));

}
function atualizarPainel(){

let disponiveis=0;
let reservados=0;
let pagos=0;

lista.forEach(item=>{

if(item.pago){

pagos++;

}else if(item.travado){

reservados++;

}else{

disponiveis++;

}

});

document.getElementById("totalNomes").innerText=lista.length;
document.getElementById("dispNomes").innerText=disponiveis;
document.getElementById("resNomes").innerText=reservados;
document.getElementById("pagNomes").innerText=pagos;

}

function render(){

const tbody=document.getElementById("tabela");

tbody.innerHTML="";

lista.forEach((item,index)=>{

const tr=document.createElement("tr");

if(item.pago){

tr.className="pago";

}else if(item.travado){

tr.className="reservado";

}else{

tr.className="disponivel";

}

let status="";
let acao="";

if(item.pago){

status='<span class="status verde">PAGO</span>';

acao="";

}

else if(item.travado){

status='<span class="status amarelo">RESERVADO</span>';

if(admin){

acao=`
<button
class="btnPago"
onclick="marcarPago(${index})">

Confirmar PIX

</button>

<button
class="btnLiberar"
onclick="liberar(${index})">

Liberar

</button>
`;

}else{

acao="Reservado";

}

}

else{

status='<span class="status azul">DISPONÍVEL</span>';

acao=`

<input
id="comp${index}"
type="text"
placeholder="Nome">

<br><br>

<button
class="btnReservar"
onclick="reservar(${index})">

Reservar

</button>

`;

}

tr.innerHTML=`

<td>${item.nome}</td>

<td>${item.comprador}</td>

<td>${status}</td>

<td>${acao}</td>

`;

tbody.appendChild(tr);

});

salvar();

atualizarPainel();

}

function reservar(index){

if(lista[index].travado){

alert("Nome já reservado.");

return;

}

const nome=document
.getElementById("comp"+index)
.value
.trim();

if(nome===""){

alert("Digite seu nome.");

return;

}

lista[index].comprador=nome;

lista[index].travado=true;

salvar();

render();

}

function liberar(index){

if(!admin){

return;

}

if(lista[index].pago){

alert("Nome já está pago.");

return;

}

if(confirm("Liberar esta reserva?")){

lista[index].comprador="";

lista[index].travado=false;

salvar();

render();

}

}

function marcarPago(index){

if(!admin){

return;

}

if(lista[index].pago){

return;

}

if(confirm("Confirmar recebimento do PIX?")){

lista[index].pago=true;

salvar();

render();

}

}

function loginAdmin(){

const senha=prompt("Senha:");

if(senha!==senhaAdmin){

alert("Senha incorreta.");

return;

}

admin=true;

document.getElementById("btnLogout").style.display="inline-block";

document.getElementById("btnReset").style.display="inline-block";

render();

}

function logoutAdmin(){

admin=false;

document.getElementById("btnLogout").style.display="none";

document.getElementById("btnReset").style.display="none";

render();

}

function pesquisar(){

const texto=document
.getElementById("pesquisa")
.value
.toLowerCase();

const linhas=document.querySelectorAll("tbody tr");

linhas.forEach(linha=>{

const nome=linha.children[0]
.innerText
.toLowerCase();

linha.style.display=nome.includes(texto)
?""
:"none";

});

}
function resetarRifa(){

    if(!admin){
        return;
    }

    const confirma = confirm(
`ATENÇÃO!

Deseja realmente RESETAR toda a rifa?

• Todos os compradores serão apagados.
• Todos os pagamentos serão removidos.
• Todos os nomes voltarão para disponíveis.

Esta ação não poderá ser desfeita.`
    );

    if(!confirma){
        return;
    }

    lista.forEach(item=>{

        item.comprador="";
        item.travado=false;
        item.pago=false;

    });

    salvar();

    render();

    alert("Rifa reiniciada com sucesso.");

}

function calcularValor(){

    let pagos=0;

    lista.forEach(item=>{

        if(item.pago){
            pagos++;
        }

    });

    return pagos*valorNome;

}

function atualizarTitulo(){

    let arrecadado=calcularValor();

    document.title=
    "Rifa - Arrecadado R$ "+arrecadado.toFixed(2);

}

const salvarOriginal=salvar;

salvar=function(){

    salvarOriginal();

    atualizarTitulo();

}

render();

atualizarTitulo();

</script>

</body>

</html>
